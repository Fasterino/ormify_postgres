[package]
name = "ormify_postgres"
version = "1.0.2"
edition = "2024"

description = "Realization of Postgres for ormify ORM Framework for your PostgreSQL database."
license = "MIT"

repository = "https://github.com/Fasterino/ormify_postgres"
homepage = "https://github.com/Fasterino/ormify_postgres"
readme = "README.md"

[features]
default = []
tokio_postgres_engine = ["tokio", "tokio-postgres", "connect_args"]
async_std_sqlx_engine = ["_sqlx_engine", "sqlx/runtime-async-std", "futures"]
tokio_sqlx_engine = ["_sqlx_engine", "sqlx/runtime-tokio", "tokio-stream"]
connect_args = ["serde"]

_sqlx_engine = ["sqlx", "connect_args"]

[dependencies]
ormify = { version = "1.0.1", features = ["orm_engine"] }
sqlx = { version = "0.9.0", optional = true, features = [
    "runtime-async-std",
    "postgres",
    "uuid",
    "chrono",
] }
tokio-postgres = { version = "0.7.18", optional = true, features = [
    "with-chrono-0_4",
    "with-uuid-1",
] }
serde = { version = "1.0.229", optional = true, features = ["derive"] }
futures = { version = "0.3.34", optional = true }
tokio-stream = { version = "0.1.19", optional = true }
tokio = { version = "1.53.3", optional = true }

[dev-dependencies]
ormify = { version = "1.0.1", features = ["orm_engine", "proc_macro"] }
tokio = { version = "1.53.3", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }

[workspace]
members = [".", "examples/ormify_postgres_example"]

[package.metadata.docs.rs]
all-features = true
